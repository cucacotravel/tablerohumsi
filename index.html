<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Tablero Humsi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="gs">
:root{--bg:#F1F4EF;--surface:#fff;--ink:#15201B;--muted:#55645B;--line:#D2DACF;--accent:#0D6B59;--accent-ink:#fff;--bad:#B03A2E}
@media (prefers-color-scheme:dark){:root{--bg:#0E1612;--surface:#15201B;--ink:#E5EEE8;--muted:#9BAEA3;--line:#2A3A32;--accent:#4DC2A6;--accent-ink:#06241D;--bad:#F27D70;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 24px}
h1{font:700 1.6rem/1.1 'Bricolage Grotesque',system-ui,sans-serif;margin:10px 0 4px}
p{margin:0 0 16px;color:var(--muted);font-size:.9rem}
label{display:grid;gap:4px;font-size:.78rem;color:var(--muted);margin-bottom:12px}
input{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
button{width:100%;font:600 .95rem 'IBM Plex Sans',system-ui,sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:11px;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--bad);font-size:.84rem;min-height:1.2em;margin:8px 0 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>
<main class="gate"><form class="box" id="f" autocomplete="off">
<svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><g fill="none" stroke="#7C3F22" stroke-width="2"><ellipse cx="20" cy="10" rx="5" ry="8"/><ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(72 20 20)"/><ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(144 20 20)"/><ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(216 20 20)"/><ellipse cx="20" cy="10" rx="5" ry="8" transform="rotate(288 20 20)"/></g><circle cx="20" cy="20" r="3" fill="#0D6B59"/></svg>
<h1>Tablero Humsi</h1><p>Solo para los socios. Escribe tu nombre y la clave que te dio Giuliano.</p>
<label for="n">Tu nombre<input id="n" list="ns" required maxlength="30" placeholder="Andrés, Marcela o Giuliano"><datalist id="ns"><option value="Andrés"><option value="Marcela"><option value="Giuliano"></datalist></label>
<label for="k">Clave<input id="k" type="password" required placeholder="xxxxx-xxxxx" autocapitalize="off" spellcheck="false"></label>
<button id="go" type="submit">Entrar</button><div id="err" role="alert"></div>
</form></main>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(clave,nombre,recordar){
  clave=clave.trim().toLowerCase();
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.v)},key,b64(ENC.c));
  const p=JSON.parse(new TextDecoder().decode(pt));
  if(recordar){try{localStorage.setItem('humsi.auth',JSON.stringify({n:nombre,k:clave}));}catch(e){}}
  window.__AUTH={clave:clave,name:nombre};
  document.getElementById('gs').remove();
  const st=document.createElement('style');st.textContent=p.css;document.head.appendChild(st);
  document.body.innerHTML=p.body;
  const sc=document.createElement('script');sc.textContent=p.js;document.body.appendChild(sc);
}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
